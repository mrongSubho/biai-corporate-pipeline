name = "biai-corporate-pipeline"
main = "src/server/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "biaileads.mrong.tech", custom_domain = true }
]

[triggers]
crons = ["*/5 * * * *"]

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "biai-pipeline-db"
database_id = "fa66524f-3670-4634-af64-861122a5fcad"
migrations_dir = "./migrations"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
DEFAULT_TIMEZONE = "Asia/Dhaka"
BENCHMARK_DATE = "2026-11-01"
WORKSPACE_ID = "ws_biai_b2b"
ALLOWED_ORIGINS = "https://biaileads.mrong.tech,https://biaicrm.mrong.tech,http://localhost:5173,http://localhost:8787"
MFA_ENCRYPTION_KEY = "biai_mfa_enc_prod_89f3a9e145b208c901e8a27d3c8b4112"
RESEND_API_KEY = "re_demo_corporate_pipeline_key"

